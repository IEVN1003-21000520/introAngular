<div class="col-6"> 
    <div class="mb-3"> 
        <div>
            <h1>Calculadora de áreas</h1>
        </div>
        <form action=""> 

            <div class="form-group pt-4"> 
                <label for="num1" class="form-label">Valor 1:</label> 
                <input [(ngModel)]="num1" 
                       type="number" 
                       name="num1" 
                       class="form-control" 
                       id="num1" 
                       placeholder="Ingresa número 1"> 
            </div> 
             <div class="form-group pt-4"> 
                <label for="num2" class="form-label">Valor 2:</label> 
                <input [(ngModel)]="num2" 
                       type="number" 
                       name="num2" 
                       class="form-control" 
                       id="num2" 
                       placeholder="Ingresa número 2"> 
            </div>

            <br>

            <label class="form-label">Selecciona una figura:</label>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="rectangulo"
                       [(ngModel)]="operacion">
                <label> Rectángulo</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="cuadrado"
                       [(ngModel)]="operacion">
                <label> Cuadrado</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="circulo"
                       [(ngModel)]="operacion">
                <label> Circulo</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="triangulo"
                       [(ngModel)]="operacion">
                <label> Triangulo</label>
            </div>

             <div>
                <input type="radio" 
                       name="operacion" 
                       value="pentagono"
                       [(ngModel)]="operacion">
                <label> Pentagono</label>
            </div>

            <br>

            <button (click)="calcular()" 
                    type="button" 
                    class="btn btn-primary">
                Calcular Área
            </button>


           
        </form> 
    </div> 
</div> 

<div class="col-6"> 
    <h2>Resultado: {{resultado}}</h2> 
</div>
