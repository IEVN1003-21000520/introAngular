<div class="col-6"> 
    <div class="mb-3"> 
        <form action=""> 

            <div class="form-group pt-4"> 
                <label for="num1" class="form-label">Número 1:</label> 
                <input [(ngModel)]="num1" 
                       type="number" 
                       name="num1" 
                       class="form-control" 
                       id="num1" 
                       placeholder="Ingresa número 1"> 
            </div> 

            <div class="form-group pt-4"> 
                <label for="num2" class="form-label">Número 2:</label> 
                <input [(ngModel)]="num2" 
                       type="number" 
                       name="num2" 
                       class="form-control" 
                       id="num2" 
                       placeholder="Ingresa número 2"> 
            </div>

            <br>

            <label class="form-label">Selecciona una operación:</label>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="sumar"
                       [(ngModel)]="operacion">
                <label> Sumar</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="restar"
                       [(ngModel)]="operacion">
                <label> Restar</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="multiplicar"
                       [(ngModel)]="operacion">
                <label> Multiplicar</label>
            </div>

            <div>
                <input type="radio" 
                       name="operacion" 
                       value="dividir"
                       [(ngModel)]="operacion">
                <label> Dividir</label>
            </div>

            <br>

            <button (click)="calcular()" 
                    type="button" 
                    class="btn btn-primary">
                Calcular
            </button>

        </form> 
    </div> 
</div> 

<div class="col-6"> 
    <h2>Resultado: {{resultado}}</h2> 
</div>
