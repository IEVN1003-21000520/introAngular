<div class="form-group pt-4">
    <label for="px1" class="form-label">Primer punto (coordenada x):</label>
    <input [(ngModel)]="px1" type="number" name="px1" class="form-control"
           id="px1" placeholder="Ingresa la coordenada X">
</div>

<div class="form-group pt-4">
    <label for="py1" class="form-label">Primer punto (coordenada y):</label>
    <input [(ngModel)]="py1" type="number" name="py1" class="form-control"
           id="py1" placeholder="Ingresa la coordenada Y">
</div>

<div class="form-group pt-4">
    <label for="px2" class="form-label">Segundo punto (coordenada x):</label>
    <input [(ngModel)]="px2" type="number" name="px2" class="form-control"
           id="px2" placeholder="Ingresa la coordenada X">
</div>

<div class="form-group pt-4">
    <label for="py2" class="form-label">Segundo punto (coordenada y):</label>
    <input [(ngModel)]="py2" type="number" name="py2" class="form-control"
           id="py2" placeholder="Ingresa la coordenada Y">
</div>

<button type="button" class="btn btn-primary mt-3"
        (click)="calcularDistancia()">
    Calcular distancia
</button>

<div class="mt-3">
    <h5>Distancia: {{ distancia }}</h5>
</div>
