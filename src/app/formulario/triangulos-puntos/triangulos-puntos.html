<div>
  <div>
    <h1 class="h3 mb-3">Triángulos por Puntos</h1>
  </div>

  <div class="form-group pt-4">
    <label for="pxa" class="form-label">Punto A (coordenada X):</label>
    <input [(ngModel)]="pxa" type="number" name="pxa" class="form-control" id="pxa" placeholder="Ingresa la coordenada X">
  </div>

  <div class="form-group pt-4">
    <label for="pya" class="form-label">Punto A (coordenada Y):</label>
    <input [(ngModel)]="pya" type="number" name="pya" class="form-control" id="pya" placeholder="Ingresa la coordenada Y">
  </div>

  <div class="form-group pt-4">
    <label for="pxb" class="form-label">Punto B (coordenada X):</label>
    <input [(ngModel)]="pxb" type="number" name="pxb" class="form-control" id="pxb" placeholder="Ingresa la coordenada X">
  </div>

  <div class="form-group pt-4">
    <label for="pyb" class="form-label">Punto B (coordenada Y):</label>
    <input [(ngModel)]="pyb" type="number" name="pyb" class="form-control" id="pyb" placeholder="Ingresa la coordenada Y">
  </div>

  <div class="form-group pt-4">
    <label for="pxc" class="form-label">Punto C (coordenada X):</label>
    <input [(ngModel)]="pxc" type="number" name="pxc" class="form-control" id="pxc" placeholder="Ingresa la coordenada X">
  </div>

  <div class="form-group pt-4">
    <label for="pyc" class="form-label">Punto C (coordenada Y):</label>
    <input [(ngModel)]="pyc" type="number" name="pyc" class="form-control" id="pyc" placeholder="Ingresa la coordenada Y">
  </div>

  <button type="button" class="btn btn-primary mt-3" (click)="calcularDistancia()">
    Revisar
  </button>

  <div class="mt-3">
    <h5>Resultado: {{ triangulo }}</h5>
  </div>
</div>
